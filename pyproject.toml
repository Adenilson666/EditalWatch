[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "editalwatch"
version = "0.1.0"
description = "Monitor automatizado de editais e oportunidades de TI"
requires-python = ">=3.11"
dependencies = [
    "beautifulsoup4>=4.12,<5",
    "httpx>=0.27,<1",
    "openpyxl>=3.1,<4",
    "pandas>=2.2,<4",
    "playwright>=1.50,<2",
    "psycopg[binary]>=3.2,<4",
    "python-dotenv>=1.0,<2",
    "tenacity>=9,<10"
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<10",
    "pytest-cov>=5,<8"
]

[project.scripts]
editalwatch = "editalwatch.cli:main"
editalwatch-db-check = "editalwatch.database_check:main"
editalwatch-api-demo = "editalwatch.api_demo:main"
editalwatch-transform-demo = "editalwatch.transformation_demo:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
markers = [
    "integration: testes que dependem de PostgreSQL"
]